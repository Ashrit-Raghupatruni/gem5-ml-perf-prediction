name: Pipeline Verification & ML CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Code Quality & Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=outputs,visualizations,dataset,ml/saved_models
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics --exclude=outputs,visualizations,dataset,ml/saved_models

      - name: Run Automated Unit & Pipeline Regression Tests
        run: |
          python -m unittest discover tests -v

      - name: Verify Decoupled Design Space Generator
        run: |
          python scripts/generate_design_space.py --samples 40 --shards 2 --output-dir /tmp/test_configs
